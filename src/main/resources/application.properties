spring.application.name=MSUsuario

# ===============================
# CONFIGURAÇÃO DO BANCO DE DADOS
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/db_ms_user?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURAÇÃO JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONFIGURAÇÕES OPCIONAIS
# ===============================
# Definir o nome do schema (opcional, se necessário)
# spring.jpa.properties.hibernate.default_schema=nome_schema

# Log das queries SQL (opcional)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# CONFIGURAÇÕES Para Prometheus
# ===============================

# Habilita todos os endpoints do Actuator (incluindo prometheus)
management.endpoints.web.exposure.include=*

# Define o caminho base dos endpoints do Actuator
management.endpoints.web.base-path=/actuator

# Porta do servidor (se quiser alterar)
server.port=8080

# Opcional: restringir apenas ao endpoint prometheus
# management.endpoints.web.exposure.include=prometheus
